<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>LimpiarAudio</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #16202b 0%, #0d1117 60%);
      color: #e6edf3; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    .logo { font-size: 3.2rem; }
    h1 { font-size: 1.6rem; margin: 0; letter-spacing: -0.5px; }
    p { color: #8b98a5; margin: 0; font-size: 0.95rem; }
    .spinner {
      width: 26px; height: 26px; border: 3px solid #2a333f;
      border-top-color: #3fb950; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-top: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">🎧</div>
  <h1>LimpiarAudio</h1>
  <div class="spinner"></div>
  <p>Arrancando el motor de audio… (la primera vez puede tardar unos segundos)</p>
</body>
</html>
